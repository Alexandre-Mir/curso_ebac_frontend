<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <img
          class="profile-avatar not-active"
          src="https://via.placeholder.com/180x180"
          alt="."
          id="avatar"
        />
        <div class="search-container">
          <input type="text" placeholder="Procure um usuário" id="search" />
          <button class="profile-link" id="search-btn" onclick="searchUser()">
            Procurar
          </button>
        </div>
        <h1 class="profile-name not-active" id="name"></h1>
        <h2 class="profile-username not-active" id="username"></h2>
        <ul class="numbers not-active">
          <li class="numbers-item">
            <h4>Repositórios</h4>
            <span id="repos"></span>
          </li>
          <li class="numbers-item">
            <h4>Seguidores</h4>
            <span id="followers"></span>
          </li>
          <li class="numbers-item">
            <h4>Seguindo</h4>
            <span id="following"></span>
          </li>
        </ul>
        <a href="#" class="profile-link not-active" id="link">Ver no Github</a>
      </div>
    </header>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const avatar = document.querySelector("#avatar");
        const name = document.querySelector("#name");
        const username = document.querySelector("#username");
        const repos = document.querySelector("#repos");
        const followers = document.querySelector("#followers");
        const following = document.querySelector("#following");
        const link = document.querySelector("#link");
        const search = document.querySelector("#search");
        const searchBtn = document.querySelector("#search-btn");
        const numbers = document.querySelector(".numbers");

        function searchUser() {
          const url = `https://api.github.com/users/${search.value}`;

          fetch(url)
            .then((response) => {
              if (response.ok) {
                return response.json();
              } else {
                throw new Error("Usuário não encontrado");
              }
            })
            .then((data) => {
              avatar.src = data.avatar_url;
              name.textContent = data.name;
              username.textContent = `@${data.login}`;
              repos.textContent = data.public_repos;
              followers.textContent = data.followers;
              following.textContent = data.following;
              link.href = data.html_url;
            })
            .catch((error) => {
              throw new Error(error);
            })
            .finally(() => {
              avatar.classList.remove("not-active");
              name.classList.remove("not-active");
              username.classList.remove("not-active");
              numbers.classList.remove("not-active");
              link.classList.remove("not-active");
            });
        }
        searchBtn.addEventListener("click", searchUser);
        search.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            searchUser();
          }
        });
      });
    </script>
  </body>
</html>
